name: Publication GitHub Pages

# Publie le site sur GitHub Pages (https://romaindufraiche.github.io/glm-site/) à chaque mise à jour
# de main, ou à la demande (onglet Actions → Publication GitHub Pages → Run workflow).
#
# Prérequis, une seule fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# GitHub Pages ne fait pas tourner PHP : cette version du site n’a pas de formulaire (contact par e-mail,
# WhatsApp et LinkedIn) et les pages légales nomment GitHub comme hébergeur.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    uses: ./.github/workflows/ci.yml

  publier:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site pour GitHub Pages
        env:
          SITE_URL: https://romaindufraiche.github.io
          BASE_PATH: /glm-site/
          PUBLIC_HEBERGEMENT: github-pages
          PUBLIC_MASQUER_EXEMPLES: oui
        run: npm run build

      # Fichiers propres à l’hébergement OVH (PHP, Apache) : inutiles et non exécutés sur GitHub Pages.
      - name: Retirer les fichiers serveur
        run: rm -rf dist/.htaccess dist/contact.php dist/_serveur

      - name: Refuser tout contenu provisoire
        run: npm run verifier:production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
